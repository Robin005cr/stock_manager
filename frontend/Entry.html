<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #333;
      padding: 24px;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .field {
      margin-bottom: 16px;
    }
    input,
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #bfc9d9;
      border-radius: 6px;
      background: #fdfdff;
      font-size: 15px;
      box-sizing: border-box;
    }
    .date-row {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 10px;
      align-items: end;
    }
    .date-row input[type="date"] {
      width: 100%;
    }
    button {
      background: #2979ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #1c5ed6;
    }
    .hint {
      font-size: 13px;
      color: #5f6f85;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Update Record</h1>
    <form id="updateForm" novalidate>
      <div class="field">
        <label for="measurement">Measurement</label>
        <input type="text" id="measurement" name="measurement" placeholder="e.g. 2 kg, 50 cm" />
      </div>
      <div class="field">
        <label for="productName">Product Name <span aria-hidden="true">*</span></label>
        <input type="text" id="productName" name="productName" required placeholder="Enter product name" />
      </div>
      <div class="field">
        <label for="company">Company <span aria-hidden="true">*</span></label>
        <input type="text" id="company" name="company" required placeholder="Enter company" />
      </div>
      <div class="field">
        <label for="category">Category <span aria-hidden="true">*</span></label>
        <input type="text" id="category" name="category" required placeholder="Enter category" />
      </div>
      <div class="field">
        <label for="quantity">Quantity <span aria-hidden="true">*</span></label>
        <input type="number" id="quantity" name="quantity" required min="0" step="1" placeholder="Enter quantity" />
        <div class="hint">Only numeric values are accepted.</div>
      </div>
      <div class="field">
        <label for="godown">Godown <span aria-hidden="true">*</span></label>
        <input type="text" id="godown" name="godown" required placeholder="Enter godown" />
      </div>
      <div class="field">
        <label>Date of Load</label>
        <div class="date-row">
          <div>
            <input type="text" id="loadDateText" name="loadDateText" placeholder="dd-mm-yyyy" autocomplete="off" />
            <div class="hint">Type the date as dd-mm-yyyy or choose from the calendar.</div>
          </div>
          <div>
            <input type="date" id="loadDatePicker" aria-label="Choose date from calendar" />
          </div>
        </div>
      </div>
      <button type="submit">Save Update</button>
    </form>
  </div>
  <script src="Update.js"></script>
</body>
</html>
